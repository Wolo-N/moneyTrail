[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneytrail"
version = "0.1.0"
description = "Rastreá a dónde va la plata: de PDFs bancarios a un diagrama de Sankey"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pydantic>=2.5",
    "typer>=0.12",
    "plotly>=5.20",
    "PyYAML>=6.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
moneytrail = "moneytrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moneytrail = ["webapp/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
